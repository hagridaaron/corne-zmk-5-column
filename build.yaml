# Normal matched pair plus local USB matrix logging on each half.
---
include:
  - board: nice_nano
    shield: corne_left
    artifact-name: corne_left-normal
  - board: nice_nano
    shield: corne_right
    artifact-name: corne_right-normal
  - board: nice_nano
    shield: corne_right
    snippet: zmk-usb-logging
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/usb-diagnostic.conf -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/config/usb-diagnostic.overlay
    artifact-name: corne_right-usb-diagnostic
  - board: nice_nano
    shield: corne_left
    snippet: zmk-usb-logging
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/usb-diagnostic.conf -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/config/usb-diagnostic.overlay
    artifact-name: corne_left-usb-diagnostic
