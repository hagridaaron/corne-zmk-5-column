# Diagnostic images only. Never let USB logging run in matrix/ISR context.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BLOCK_IN_THREAD_TIMEOUT_MS=0
CONFIG_LOG_MODE_OVERFLOW=y
# Give CDC enumeration/host capture time before draining startup logs.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=16384
# Startup logs exceeded the stock 1024-byte CDC FIFO. Pair a larger FIFO
# with CDC backpressure (overlay), rather than silently losing the remainder.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=64
# Avoid recursive logging from the USB transport itself.
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y
